<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of taking one color out of sRGB and back: sRGB in, linearize, to XYZ, perceptual, adapt, appearance, invert, and measure. A hex triple is decoded to eight bits a channel, the sRGB transfer curve is undone, and a single three by three matrix carrying the primaries as columns lands the color in XYZ. From there it reaches the perceptual spaces, Oklab and CIELAB and JzAzBz and ICtCp among twenty-six named conversions in all. Chromatic adaptation moves the white point using any of nine matrices across seven illuminants, and the appearance models, CIECAM02 and CAM16, add viewing conditions: a white point, an adapting luminance, a background and a surround. Then the steps that carry an inverse run backwards, CIECAM02 and Oklab among them, and the result is measured against where it started. Round tripping sRGB to Oklab and back over a twenty-six cubed grid never moves a channel more than four times ten to the minus fourteen, and adapting D65 to D50 and back returns within three units in the last place for all nine matrices. Three outcomes: the round trip holds, the color is out of gamut, or the input was never a color."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">A CONVERSION YOU CANNOT CHECK IS A CONVERSION YOU HAVE TO TRUST</text><text class="h" x="44" y="72">How a color leaves sRGB, crosses four models, and comes back</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M592.25 206V228H143.25V213"/><text class="k" x="367.75" y="245" text-anchor="middle" fill="var(--drift)">SRGB TO OKLAB AND BACK UNDER 1E-13</text><path class="back" marker-end="url(#ab)" d="M592.25 398V420H143.25V405"/><text class="k" x="367.75" y="437" text-anchor="middle" fill="var(--drift)">ALL NINE MATRICES UNDO UNDER 1E-15</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">sRGB in</text><text class="s" x="58" y="168">Eight bits a channel, transfer</text><text class="s" x="58" y="183">encoded.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Linearize</text><text class="s" x="282.5" y="168">Undo the curve, keep the</text><text class="s" x="282.5" y="183">primaries.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">To XYZ</text><text class="s" x="507" y="168">One matrix, primaries as its</text><text class="s" x="507" y="183">columns.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Perceptual</text><text class="s" x="731.5" y="168">Oklab, CIELAB, JzAzBz, ICtCp.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Adapt</text><text class="s" x="58" y="360">Nine matrices, seven</text><text class="s" x="58" y="375">illuminants.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Appearance</text><text class="s" x="282.5" y="360">CIECAM02 and CAM16, viewing</text><text class="s" x="282.5" y="375">conditions and all.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Invert</text><text class="s" x="507" y="360">CIECAM02 and Oklab, run</text><text class="s" x="507" y="375">backwards.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Measure</text><text class="s" x="731.5" y="360">Distance from where it</text><text class="s" x="731.5" y="375">started.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">ROUND TRIP HOLDS</text><text class="s" x="58" y="509" font-size="10.5">error at the floating-point floor</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">OUT OF GAMUT</text><text class="s" x="357.33" y="509" font-size="10.5">clipped, compressed, or reduced</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">NOT A COLOR</text><text class="s" x="656.67" y="509" font-size="10.5">the input never parsed</text><text class="s" x="44" y="546">Every stage here is a pure function of arrays, so the trip back is not a courtesy. It is the only way to tell a correct matrix from a plausible one. The numbers on the return edges were measured on this checkout and are asserted in the test suite, so a transform that drifts fails the build rather than shipping a color that looks close enough.</text></svg>
