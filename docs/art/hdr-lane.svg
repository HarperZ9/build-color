<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of taking scene light to a panel: scene light, encode, decode, check, tone map, gamut, display, and difference. Scene light is linear and unbounded, well above one. It is encoded with PQ, which covers ten thousand candela per square metre in a signal from zero to one, or with HLG over its own zero to one domain. Decoding returns the light that went in: PQ round trips to within three parts in ten to the thirteen relative across its full range, and HLG to within seven times ten to the minus sixteen absolute inside its domain. Tone mapping applies one of twelve operators, each a single call. Gamut mapping then clips, compresses, or reduces chroma in Oklab, and the result is re-encoded for the panel. Seven difference metrics grade what changed. Eleven of the twelve operators are monotone non-decreasing over the range tested, so a brighter sample never comes out darker than a dimmer one. The Gran Turismo curve is the exception and falls at the handoff between its toe and its shoulder. Three outcomes: displayable, compressed, or answered in absolute units."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">THE BRIGHT HALF OF THE SIGNAL, AND WHAT SURVIVES THE TRIP TO A PANEL</text><text class="h" x="44" y="72">How scene light becomes display light without losing its order</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M592.25 206V228H143.25V213"/><text class="k" x="367.75" y="245" text-anchor="middle" fill="var(--drift)">BOTH CURVES DECODE WHAT THEY ENCODE</text><path class="back" marker-end="url(#ab)" d="M592.25 398V420H143.25V405"/><text class="k" x="367.75" y="437" text-anchor="middle" fill="var(--drift)">ELEVEN OF TWELVE PRESERVE ORDER</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Scene light</text><text class="s" x="58" y="168">Linear, unbounded, well above</text><text class="s" x="58" y="183">one.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Encode</text><text class="s" x="282.5" y="168">PQ over ten thousand nits, or</text><text class="s" x="282.5" y="183">HLG.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Decode</text><text class="s" x="507" y="168">Back to the light that went</text><text class="s" x="507" y="183">in.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Check</text><text class="s" x="731.5" y="168">Relative error across the</text><text class="s" x="731.5" y="183">range.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Tone map</text><text class="s" x="58" y="360">Twelve operators, one call</text><text class="s" x="58" y="375">each.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Gamut</text><text class="s" x="282.5" y="360">Clip, compress, or reduce</text><text class="s" x="282.5" y="375">chroma.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Display</text><text class="s" x="507" y="360">Re-encode for the panel</text><text class="s" x="507" y="375">showing it.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Difference</text><text class="s" x="731.5" y="360">Seven metrics, graded.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">DISPLAYABLE</text><text class="s" x="58" y="509" font-size="10.5">inside the panel's range</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">COMPRESSED</text><text class="s" x="357.33" y="509" font-size="10.5">highlights bought with contrast</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">ABSOLUTE UNITS</text><text class="s" x="656.67" y="509" font-size="10.5">three answer in their own units</text><text class="s" x="44" y="546">Tone mapping throws information away on purpose, so a round trip is the wrong question to ask of it. The right one is whether order survives: if two samples went in with one brighter than the other, they have to come out that way. Eleven of the twelve hold that across the range tested. The Gran Turismo curve does not: it falls by about a tenth at the point where its toe hands off, because the linear segment that belongs between toe and shoulder is missing from the implementation. Three of the twelve answer in absolute units and can exceed one, which is a property of the standards they implement.</text></svg>
