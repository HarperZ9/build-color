name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The README drawings are rendered from docs/art/build-color.art.json, so they rot
  # like any other derived file: a bound moves, nobody re-renders, and the picture
  # describes something that stopped being true. This re-renders every drawing,
  # compares bytes, and checks that each one fits the columns it is drawn in.
  # Whether a drawing is TRUE of the code is a separate question, answered by
  # tests/test_repo_art.py in the test job.
  repo-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the front-page artwork
        run: python tools/check_repo_art.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff + mypy
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Run tests with coverage
        run: pytest tests/ -q --cov=build_color --cov-report=term-missing --cov-fail-under=45
